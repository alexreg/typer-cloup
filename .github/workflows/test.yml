name: Test
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        resolution: [highest]
        include:
          - python-version: "3.11"
            resolution: lowest-direct
          - python-version: "3.15"
            resolution: lowest-direct
      fail-fast: false
    env:
      UV_RESOLUTION: ${{ matrix.resolution }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      # Read requirements directly so `lowest-direct` exercises their bounds.
      - name: Install Dependencies
        run: uv pip install --requirement pyproject.toml --extra test --editable .
      - name: Lint
        run: bash scripts/lint.sh
      - run: mkdir coverage
      - name: Test
        run: bash scripts/test.sh
        env:
          COVERAGE_FILE: coverage/.coverage.${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.resolution }}
          CONTEXT: ${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.resolution }}
      - name: Store coverage files
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.resolution }}
          path: coverage
          include-hidden-files: true
  coverage-combine:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get coverage files
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - run: python -m pip install "coverage[toml] >= 7.15.4, < 8.0"
      - run: ls -la coverage
      - run: coverage combine coverage
      - run: coverage report
      - run: coverage html --show-contexts --title "Coverage for ${{ github.sha }}"
      - name: Store coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          include-hidden-files: true
