[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core ~= 3.10"]

[project]
authors = [
  {name = "Sebastián Ramírez", email = "tiangolo@gmail.com"},
  {name = "Alexander Regueiro", email = "alex@noldorin.com"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "click >= 8.5.0, < 9.0",
  "cloup ~= 4.0",
]
dynamic = ["version", "description"]
keywords = ["cli", "click", "cloup", "shell", "terminal", "typer", "typehints"]
license = {file = "LICENSE"}
maintainers = [
  {name = "Alexander Regueiro", email = "alex@noldorin.com"},
]
name = "typer-cloup"
readme = "README.md"
requires-python = ">= 3.11"

[project.urls]
documentation = "https://typer-cloup.netlify.app"
homepage = "https://github.com/alexreg/typer-cloup"
repository = "https://github.com/alexreg/typer-cloup"

[project.optional-dependencies]
all = [
  "colorama ~= 0.4.4",
  "docstring_parser >= 0.17.0, < 1.0",
]
dev = [
  "autoflake ~= 1.4.0",
  "flake8 ~= 4.0.1",
  "pre-commit ~= 2.19.0",
]
doc = [
  "cairosvg ~= 2.5.2",
  "mdx-include ~= 1.4.1",
  "mkdocs ~= 1.2.4",
  "mkdocs-material ~= 8.1.11",
  "pillow ~= 9.3.0",
]
test = [
  "black >= 26.5.0, < 27.0",
  "coverage >= 7.15.4, < 8.0",
  "docstring_parser >= 0.17.0, < 1.0",
  "isort >= 5.12.0, < 6.0",
  "mypy ~= 2.4",
  "pytest >= 9.1.1, < 10.0",
  "pytest-cov >= 7.1.0, < 8.0",
  "pytest-sugar >= 1.1.1, < 2.0",
  "pytest-xdist >= 3.8.0, < 4.0",
]

[tool.flit.module]
name = "typer_cloup"

[tool.black]
target-version = ["py311"]

[tool.isort]
known_third_party = ["typer", "click", "cloup"]
profile = "black"
skip_glob = [
  "docs_src/subcommands/tutorial001/main.py",
  "docs_src/subcommands/tutorial003/lands.py",
  "docs_src/subcommands/tutorial003/main.py",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
]
filterwarnings = [
  "error",
  'ignore:starlette.middleware.wsgi is deprecated and will be removed in a future release\..*:DeprecationWarning:starlette', # For pytest-xdist
  'ignore::DeprecationWarning:xdist',
]
junit_family = "xunit2"
xfail_strict = true
